<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Панель управления · Ирина Юнаева</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;450;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════
       LOGIN SCREEN
       ═══════════════════════════════════════════════════════ -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-logo">
        <h1>Ирина Юнаева</h1>
        <p>Панель управления сайтом</p>
      </div>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="loginPassword">Пароль</label>
          <input type="password" id="loginPassword" placeholder="Введите пароль администратора" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
          <span class="spinner"></span>
          <span class="btn-text">Войти</span>
        </button>
      </form>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       DASHBOARD
       ═══════════════════════════════════════════════════════ -->
  <div class="dashboard" id="dashboard">

    <!-- ── Top Bar ── -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title">Ирина Юнаева</span>
        <span class="topbar-badge">Админ</span>
      </div>
      <div class="topbar-actions">
        <div class="save-status" id="saveStatus">
          <span class="dot"></span>
          <span>Сохранено</span>
        </div>
        <button class="btn btn-primary btn-sm" id="saveBtn" onclick="saveData()">
          <span class="spinner"></span>
          <span class="btn-text">💾 Сохранить</span>
        </button>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Выйти</button>
      </div>
    </header>

    <!-- ── Sidebar ── -->
    <nav class="sidebar">
      <ul class="sidebar-nav" id="sidebarNav">
        <li><a href="#" class="active" data-tab="hero" onclick="switchTab('hero', this)">
          <span class="tab-icon">🏠</span><span class="tab-label">Главная</span>
        </a></li>
        <li><a href="#" data-tab="poems" onclick="switchTab('poems', this)">
          <span class="tab-icon">📝</span><span class="tab-label">Стихи</span>
        </a></li>
        <li><a href="#" data-tab="videos" onclick="switchTab('videos', this)">
          <span class="tab-icon">🎬</span><span class="tab-label">Видео</span>
        </a></li>
        <li><a href="#" data-tab="tracks" onclick="switchTab('tracks', this)">
          <span class="tab-icon">🎵</span><span class="tab-label">Музыка</span>
        </a></li>
        <li><a href="#" data-tab="about" onclick="switchTab('about', this)">
          <span class="tab-icon">👤</span><span class="tab-label">О себе</span>
        </a></li>
        <li><a href="#" data-tab="settings" onclick="switchTab('settings', this)">
          <span class="tab-icon">⚙️</span><span class="tab-label">Настройки</span>
        </a></li>
      </ul>
    </nav>

    <!-- ── Main Content Area ── -->
    <main class="main-content">

      <!-- TAB: Hero -->
      <div class="tab-panel active" id="tab-hero"></div>

      <!-- TAB: Poems -->
      <div class="tab-panel" id="tab-poems"></div>

      <!-- TAB: Videos -->
      <div class="tab-panel" id="tab-videos"></div>

      <!-- TAB: Tracks -->
      <div class="tab-panel" id="tab-tracks"></div>

      <!-- TAB: About -->
      <div class="tab-panel" id="tab-about"></div>

      <!-- TAB: Settings -->
      <div class="tab-panel" id="tab-settings"></div>

    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="admin.js"></script>
</body>
</html>
